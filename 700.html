    .option-btn.reveal-correct { background: #d1fae5; border-color: #10b981; color: #065f46; font-weight: 700; }

    .feedback-wrong { color: #991b1b; background: #fee2e2; }
    .feedback-icon { font-size: 1.6rem; }
    .action-buttons { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin: 16px; }
    .btn { padding: 8px 40px; margin: 8px 0px; border-radius: 60px; font-weight: 600; font-size: 0.6rem; border: none; cursor: pointer; transition: 0.15s; background: white; border: 2px solid #cbd5e1; color: #1e2a3e; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: #1e2a3e; border: 2px solid #1e2a3e; color: white; }
    .btn-primary:hover:not(:disabled) { background: #0f1a2b; border-color: #0f1a2b; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary { background: #f1f5f9; border-color: #cbd5e1; }

    .btn-email:hover:not(:disabled) { background: #dfeaff; border-color: #93b4e6; }
    .btn-email.loading { position: relative; color: transparent; }
    .btn-email.loading::after { content: ''; position: absolute; width: 18px; height: 18px; border: 3px solid #1e3a8a; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .email-section { margin-top: 24px; padding-top: 20px; border-top: 2px dashed #d9e2ef; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }

    .notice-modal { width: min(100%, 390px); padding: 30px; border-radius: 22px; background: #fff; box-shadow: 0 24px 64px rgba(15, 26, 43, .24); text-align: center; transform: translateY(14px) scale(.97); transition: transform .2s ease; }

    .notice-modal h2 { margin: 0; color: #172033; font-size: 1.3rem; }
    .notice-modal p { margin: 10px 0 22px; color: #61708a; line-height: 1.6; }
    .notice-modal .btn { min-width: 132px; }

</head>

    <div class="options-grid" id="optionsContainer"></div>

  </div>

  <div class="footer">⚡ 答错的汉字会自动加入后面题库，直到答对为止 · 进度自动储存 · 随时可寄送成绩</div>
</div>
<button class="floating-email-btn hidden" id="floatingEmailBtn" title="寄送成绩给老师">📧 寄送成绩</button>
<button class="sound-toggle" id="soundToggle" title="切换音效">🔊</button>
<div class="toast" id="toast"></div>

<div class="notice-modal-overlay" id="noticeModalOverlay" aria-hidden="true">
  <section class="notice-modal" role="alertdialog" aria-modal="true" aria-labelledby="noticeModalTitle" aria-describedby="noticeModalMessage">
    <div class="notice-modal-icon" aria-hidden="true">💡</div>
    <h2 id="noticeModalTitle">提示</h2><p id="noticeModalMessage"></p>
    <button class="btn btn-primary" id="noticeModalClose" type="button">我知道了</button>
  </section>
</div>

    function playCheerfulSound() { if (!soundEnabled) return; const ctx = getAudioContext(); if (!ctx) return; const now = ctx.currentTime; const notes = [{ freq: 523.25, start: 0.00, dur: 0.12 }, { freq: 659.25, start: 0.10, dur: 0.12 }, { freq: 783.99, start: 0.20, dur: 0.12 }, { freq: 1046.50, start: 0.30, dur: 0.25 }]; notes.forEach(note => { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(note.freq, now + note.start); gain.gain.setValueAtTime(0, now + note.start); gain.gain.linearRampToValueAtTime(0.25, now + note.start + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + note.start + note.dur); osc.connect(gain); gain.connect(ctx.destination); osc.start(now + note.start); osc.stop(now + note.start + note.dur + 0.05); }); }
    function playSadSound() { if (!soundEnabled) return; const ctx = getAudioContext(); if (!ctx) return; const now = ctx.currentTime; const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(220, now); osc.frequency.linearRampToValueAtTime(180, now + 0.18); gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.75, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22); osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.25); }
    function updateSoundToggleUI() { if (soundEnabled) { soundToggle.textContent = '🔊'; soundToggle.classList.remove('muted'); soundToggle.title = '音效开启 (点击静音)'; } else { soundToggle.textContent = '🔇'; soundToggle.classList.add('muted'); soundToggle.title = '音效关闭 (点击开启)'; } }
    soundToggle.addEventListener('click', () => { soundEnabled = !soundEnabled; updateSoundToggleUI(); if (soundEnabled) { const ctx = getAudioContext(); if (ctx) { const now = ctx.currentTime; const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(880, now); gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15); osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.2); } } });
    let toastTimeout = null;
    function showToast(message, type = 'info', duration = 3500) { if (toastTimeout) clearTimeout(toastTimeout); toast.textContent = message; toast.className = 'toast show ' + type; toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, duration); }
    function saveProgress() { if (!studentName) return; const state = { studentName: studentName, score: score, questionQueue: questionQueue, currentQuestion: currentQuestion, answered: answered, timestamp: Date.now() }; try { localStorage.setItem(STORAGE_PREFIX + studentName, JSON.stringify(state)); } catch (e) {} updateSavedSessionsList(); }
    function loadProgress(name) { try { const raw = localStorage.getItem(STORAGE_PREFIX + name); if (!raw) return null; const state = JSON.parse(raw); if (state.studentName !== name) return null; if (!Array.isArray(state.questionQueue)) return null; return state; } catch (e) { return null; } }
    function deleteProgress(name) { try { localStorage.removeItem(STORAGE_PREFIX + name); } catch (e) {} updateSavedSessionsList(); }
    function getAllSavedSessions() { const sessions = []; for (let i = 0; i < localStorage.length; i++) { const key = localStorage.key(i); if (key && key.startsWith(STORAGE_PREFIX)) { const name = key.slice(STORAGE_PREFIX.length); try { const raw = localStorage.getItem(key); if (raw) { const state = JSON.parse(raw); sessions.push({ name: name, score: state.score || 0, remaining: getRemainingQuestions(state.score || 0), timestamp: state.timestamp || 0 }); } } catch (e) {} } } sessions.sort((a, b) => b.timestamp - a.timestamp); return sessions; }
    function updateSavedSessionsList() { const sessions = getAllSavedSessions(); if (sessions.length === 0) { savedSessionsContainer.classList.add('hidden'); return; } savedSessionsContainer.classList.remove('hidden'); sessionTags.innerHTML = ''; sessions.forEach(session => { const tag = document.createElement('span'); tag.className = 'session-tag'; if (studentName === session.name) tag.classList.add('active'); const label = document.createElement('span'); label.textContent = `${session.name} (${session.score}分 / 剩${session.remaining}题)`; label.addEventListener('click', (e) => { e.stopPropagation(); studentNameInput.value = session.name; checkResumeAvailability(session.name); }); tag.appendChild(label); const del = document.createElement('span'); del.className = 'delete-session'; del.textContent = '✕'; del.title = '删除此进度'; del.addEventListener('click', (e) => { e.stopPropagation(); if (confirm(`确定要删除「${session.name}」的储存进度吗？`)) { deleteProgress(session.name); if (studentName === session.name) { studentName = ''; checkResumeAvailability(""); } } }); tag.appendChild(del); tag.addEventListener('dblclick', () => { studentNameInput.value = session.name; resumeQuiz(session.name); }); sessionTags.appendChild(tag); }); }
    function checkResumeAvailability(name) { const saved = name ? loadProgress(name) : null; const canResume = Boolean(saved) && !(quizActive && studentName === name); resumeQuizBtn.disabled = !canResume; resumeQuizBtn.classList.toggle("hidden", !canResume); }
    function updateFloatingEmailButton() { if (studentName && studentName.trim()) { floatingEmailBtn.classList.remove('hidden'); } else { floatingEmailBtn.classList.add('hidden'); } }
    function sendResultEmail(fromFloating = false) { if (isSendingEmail) { showToast('⏳ 正在寄送中，请稍候...', 'info'); return; } if (!studentName || !studentName.trim()) { showToast('⚠️ 请先输入学生姓名，才能寄送成绩。', 'info'); return; } if (typeof emailjs === 'undefined') { showToast('⚠️ EmailJS 未载入，请检查网路连线。', 'error'); return; } const remaining = getRemainingQuestions(); const totalAnswered = 100 - remaining; const percentage = totalAnswered > 0 ? Math.round((score / totalAnswered) * 100) : 0; let status; if (quizActive) { status = '进行中 (暂停/中断)'; } else if (remaining === 0) { status = '已完成'; } else { status = '已停止 (未完成)'; } const messageBody = [`测验名：${quiz_name}`, `学生姓名：${studentName}`, '', '--- 详细进度 ---', `测验状态：${status}`, `目前得分：${score} 分`, `已答对题数：${score} 题`, `尚未完成题数：${remaining} 题`, `寄送时间：${new Date().toLocaleString('zh-TW')}`].join('\n'); const templateParams = { quiz_name: quiz_name, student_name: studentName, status: status, score: score, remaining: remaining, percentage: percentage, timestamp: new Date().toLocaleString('zh-TW'), message: messageBody }; isSendingEmail = true; const targetBtn = fromFloating ? floatingEmailBtn : sendEmailDuringQuizBtn; const originalText = targetBtn.textContent; if (fromFloating) { floatingEmailBtn.disabled = true; floatingEmailBtn.textContent = '⏳ 寄送中...'; } else { sendEmailDuringQuizBtn.classList.add('loading'); sendEmailDuringQuizBtn.disabled = true; } emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams).then(function(response) { console.log('EmailJS 成功:', response.status, response.text); showToast(`✅ 成绩已成功寄送给老师！（${studentName}）`, 'success', 4000); }).catch(function(error) { console.error('EmailJS 错误:', error); let errorMsg = '寄送失败'; if (error && error.text) { errorMsg += '：' + error.text; } else if (error && error.message) { errorMsg += '：' + error.message; } showToast(`❌ ${errorMsg}。请稍后再试。`, 'error', 5000); }).finally(function() { isSendingEmail = false; if (fromFloating) { floatingEmailBtn.disabled = false; floatingEmailBtn.textContent = originalText; } else { sendEmailDuringQuizBtn.classList.remove('loading'); sendEmailDuringQuizBtn.disabled = false; } }); }
    function resetToSetup() { quizPanel.classList.add('hidden'); emailPanel.classList.add('hidden'); setupPanel.classList.remove('hidden'); quizActive = false; answered = false; currentQuestion = null; questionQueue = []; score = 0; resumeBadge.classList.add('hidden'); updateScoreAndProgress(); feedbackMessage.innerHTML = '<span>✨ 选一个拼音吧</span>'; feedbackMessage.className = 'feedback-area'; currentCharDisplay.textContent = '一'; optionsContainer.innerHTML = ''; nextBtn.disabled = true; updateSavedSessionsList(); checkResumeAvailability(studentNameInput.value.trim()); updateFloatingEmailButton(); }
    function getRemainingQuestions(scoreValue = score) { return Math.max(0, TOTAL_QUESTIONS - scoreValue); }
    function updateScoreAndProgress() { scoreDisplay.textContent = `得分：${score}`; const remaining = getRemainingQuestions(); progressDisplay.textContent = `剩余：${remaining} 题`; }
    function startNewQuiz() { const name = studentNameInput.value.trim(); if (!name) { showNotice('请输入姓名后再开始测验。'); return; } const existing = loadProgress(name); if (existing) { if (!confirm(`「${name}」已有储存的进度（得分 ${existing.score}，剩余 ${getRemainingQuestions(existing.score || 0)} 题）。\n\n按「确定」会开始新测验并覆盖旧进度。\n按「取消」则载入旧进度。`)) { resumeQuiz(name); return; } deleteProgress(name); } studentName = name; score = 0; answered = false; currentQuestion = null; let fullPool = CHARACTERS.map(item => ({ ...item })); for (let i = fullPool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [fullPool[i], fullPool[j]] = [fullPool[j], fullPool[i]]; } questionQueue = fullPool; quizActive = true; resumeBadge.classList.add('hidden'); setupPanel.classList.add('hidden'); quizPanel.classList.remove('hidden'); emailPanel.classList.add('hidden'); loadNextQuestion(); updateScoreAndProgress(); saveProgress(); updateFloatingEmailButton(); }
    function resumeQuiz(name) { const state = loadProgress(name); if (!state) { showNotice('找不到此学生的储存进度。', '无法恢复进度'); return; } studentName = state.studentName; score = state.score || 0; questionQueue = state.questionQueue || []; currentQuestion = state.currentQuestion || null; answered = state.answered || false; if (currentQuestion && (!currentQuestion.char || !currentQuestion.pinyin)) { currentQuestion = null; } if (questionQueue.length === 0 && !currentQuestion) { if (confirm('此进度已完成所有题目，是否查看成绩？')) { studentNameInput.value = studentName; finishQuiz(true); } return; } quizActive = true; resumeBadge.classList.remove('hidden'); setupPanel.classList.add('hidden'); quizPanel.classList.remove('hidden'); emailPanel.classList.add('hidden'); if (currentQuestion && answered) { renderCurrentQuestion(true); } else if (currentQuestion && !answered) { renderCurrentQuestion(false); } else if (questionQueue.length > 0) { loadNextQuestion(); } updateScoreAndProgress(); updateFloatingEmailButton(); }
    function renderCurrentQuestion(alreadyAnswered) { if (!currentQuestion) return; currentCharDisplay.textContent = currentQuestion.char; optionsContainer.innerHTML = ''; feedbackMessage.innerHTML = ''; nextBtn.disabled = !alreadyAnswered; const correctPinyin = currentQuestion.pinyin; const distractorPool = CHARACTERS.map(item => item.pinyin).filter(z => z !== correctPinyin); const uniqueDistractors = [...new Set(distractorPool)]; const shuffled = [...uniqueDistractors].sort(() => Math.random() - 0.5); const selectedDistractors = shuffled.slice(0, 3); while (selectedDistractors.length < 3) { selectedDistractors.push('bā'); } const options = [correctPinyin, ...selectedDistractors]; for (let i = options.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [options[i], options[j]] = [options[j], options[i]]; } optionButtons = []; options.forEach((pinyin) => { const btn = document.createElement('button'); btn.className = 'option-btn'; btn.textContent = pinyin; btn.dataset.pinyin = pinyin; btn.addEventListener('click', () => onOptionClick(pinyin)); optionsContainer.appendChild(btn); optionButtons.push(btn); }); if (alreadyAnswered) { optionButtons.forEach(btn => { btn.disabled = true; if (btn.dataset.pinyin === correctPinyin) { btn.classList.add('reveal-correct'); } }); feedbackMessage.innerHTML = `<span class="feedback-icon">⏸️</span> 此题已作答，正确读音是 ${correctPinyin}。请按「下一题」继续。`; feedbackMessage.className = 'feedback-area'; nextBtn.disabled = false; } else { feedbackMessage.innerHTML = '<span>✨ 选一个拼音吧</span>'; feedbackMessage.className = 'feedback-area'; } }
    function loadNextQuestion() { if (!quizActive) return; optionsContainer.innerHTML = ''; feedbackMessage.innerHTML = '<span>✨ 选一个拼音吧</span>'; feedbackMessage.className = 'feedback-area'; nextBtn.disabled = true; answered = false; if (questionQueue.length === 0) { currentQuestion = null; finishQuiz(true); return; } currentQuestion = questionQueue.shift(); renderCurrentQuestion(false); updateScoreAndProgress(); saveProgress(); }
    function onOptionClick(selectedPinyin) { if (!quizActive || answered || !currentQuestion) return; answered = true; const correctPinyin = currentQuestion.pinyin; const isCorrect = (selectedPinyin === correctPinyin); optionButtons.forEach(btn => { btn.disabled = true; if (btn.dataset.pinyin === correctPinyin) { btn.classList.add('reveal-correct'); } }); optionButtons.forEach(btn => { if (btn.dataset.pinyin === selectedPinyin) { if (isCorrect) { btn.classList.add('correct-guess'); } else { btn.classList.add('wrong-guess'); } } }); if (isCorrect) { playCheerfulSound(); score++; feedbackMessage.innerHTML = `<span class="feedback-icon">✅</span> 正确！「${currentQuestion.char}」读作 ${correctPinyin}`; feedbackMessage.className = 'feedback-area feedback-correct'; } else { playSadSound(); feedbackMessage.innerHTML = `<span class="feedback-icon">❌</span> 不对哦～「${currentQuestion.char}」正确读音是 ${correctPinyin}。此字会再出现。`; feedbackMessage.className = 'feedback-area feedback-wrong'; if (currentQuestion) { questionQueue.push({ ...currentQuestion }); } } updateScoreAndProgress(); nextBtn.disabled = false; saveProgress(); }
    function goToNextQuestion() { if (!quizActive) return; if (!answered) return; currentQuestion = null; if (questionQueue.length === 0) { finishQuiz(true); return; } loadNextQuestion(); }
    function finishQuiz(completed = false) { quizActive = false; quizPanel.classList.add('hidden'); emailPanel.classList.remove('hidden'); setupPanel.classList.add('hidden'); const remaining = getRemainingQuestions(); emailHint.innerHTML = completed ? `🎉 测验完成！得分：${score} / ${TOTAL_QUESTIONS} (剩余未答：${remaining})` : `⏸️ 测验已停止。得分：${score}，尚未完成的题数：${remaining}`; if (completed) { deleteProgress(studentName); } updateSavedSessionsList(); updateFloatingEmailButton(); }
    function stopQuiz() { if (!quizActive) return; if (confirm('确定要停止测验吗？目前成绩与进度将会储存，下次可恢复。')) { saveProgress(); quizActive = false; quizPanel.classList.add('hidden'); emailPanel.classList.remove('hidden'); setupPanel.classList.add('hidden'); const remaining = getRemainingQuestions(); emailHint.innerHTML = `⏸️ 测验已停止。得分：${score}，尚未完成的题数：${remaining}。进度已储存，下次可恢复。`; updateSavedSessionsList(); updateFloatingEmailButton(); } }
    function restartQuiz() { resetToSetup(); studentNameInput.value = ''; studentName = ''; checkResumeAvailability(""); updateSavedSessionsList(); updateFloatingEmailButton(); }
    startQuizBtn.addEventListener('click', startNewQuiz);
    resumeQuizBtn.addEventListener('click', () => { const name = studentNameInput.value.trim(); if (!name) { showNotice('请先输入姓名。'); return; } resumeQuiz(name); });
    stopQuizBtn.addEventListener('click', stopQuiz);
    nextBtn.addEventListener('click', goToNextQuestion);
    sendEmailBtn.addEventListener('click', () => sendResultEmail(false));
    sendEmailDuringQuizBtn.addEventListener('click', () => sendResultEmail(false));
    floatingEmailBtn.addEventListener('click', () => sendResultEmail(true));
    restartBtn.addEventListener('click', restartQuiz);
    studentNameInput.addEventListener('input', () => { const name = studentNameInput.value.trim(); checkResumeAvailability(name); if (!quizActive) { if (!quizActive && !studentName) { floatingEmailBtn.classList.add('hidden'); } } });
    studentNameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); const name = studentNameInput.value.trim(); if (!name) return; const existing = loadProgress(name); if (existing && !quizActive) { if (confirm(`「${name}」已有储存的进度（得分 ${existing.score}，剩余 ${getRemainingQuestions(existing.score || 0)} 题）。\n\n按「确定」恢复进度。\n按「取消」开始新测验（会覆盖旧进度）。`)) { resumeQuiz(name); return; } } startNewQuiz(); } });
    resetToSetup(); updateSavedSessionsList(); updateSoundToggleUI();
    window.addEventListener('beforeunload', () => { if (quizActive && studentName) { saveProgress(); } });
    setInterval(() => { if (quizActive && studentName) { saveProgress(); } }, 30000);
  })();
</script>
